spring.application.name=brumkul-ramazan-student-api
server.port=8080
server.servlet.context-path=/brumkul-ramazan

spring.datasource.url=jdbc:postgresql://localhost:5432/brumkul_ramazan_students
spring.datasource.username=brumkul_ramazan
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

app.student.full-name=${STUDENT_FULL_NAME:Ramazan Brumkul}
app.student.group=${STUDENT_GROUP:IT2-2301}
app.student.id=${STUDENT_ID:37911}
