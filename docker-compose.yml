name: brumkul-ramazan-student-api

services:
  postgres:
    image: postgres:16-alpine
    container_name: brumkul-ramazan-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brumkul_ramazan_students}
      POSTGRES_USER: ${POSTGRES_USER:-brumkul_ramazan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - student-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0}
    image: brumkul-ramazan-student-api:v${APP_VERSION:-1.0}-brumkul-ramazan
    container_name: brumkul-ramazan-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-brumkul_ramazan_students}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-brumkul_ramazan}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      STUDENT_FULL_NAME: Ramazan Brumkul
      STUDENT_GROUP: IT2-2301
      STUDENT_ID: "37911"
    ports:
      - "${APP_PORT:-8081}:8080"
    networks:
      - student-api-network
    restart: unless-stopped

volumes:
  postgres-data:
    name: brumkul-ramazan-postgres-data

networks:
  student-api-network:
    name: brumkul-ramazan-network
    driver: bridge
